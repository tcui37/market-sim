[project]
name = "market-sim"
version = "0.1.0"
description = "Backtest market strategies against real historical data."
requires-python = ">=3.12,<3.15"
dependencies = [
    "vectorbt>=1.1,<2",
    "yfinance>=1.6",
    "streamlit>=1.61",
    "plotly>=5.18,<6",  # vectorbt 1.x uses plotly APIs removed in 6
    "pyarrow>=24",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["market", "market.data", "market.sim", "market.metrics", "market.plots"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
